name: Lint
on: [push, pull_request]

env:
  HADOLINT_VERSION: v1.17.2
  SHELLCHECK_OPTS: -e SC1008 -s bash

jobs:
  hadolint:
    runs-on: ubuntu-latest
    name: hadolint
    steps:
      - name: ⏬ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ✔️ Run linter
        id: changed_files
        run: |
          shopt -s globstar
          shopt -s nullglob
          for dockerfile in **/Dockerfile; do
            echo "Linting: $dockerfile"
            docker run --rm -i \
              -v $(pwd)/.hadolint.yaml:/.hadolint.yaml:ro \
              hadolint/hadolint:${{ env.HADOLINT_VERSION }} < "$dockerfile"
          done

  jq:
    runs-on: ubuntu-latest
    name: JQ
    steps:
      - name: ⏬ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ✔️ Run linter
        run: |
          shopt -s globstar
          shopt -s nullglob
          cat **/*.json | jq '.'

  shellcheck:
    runs-on: ubuntu-latest
    name: ShellCheck
    steps:
      - name: ⏬ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ✔️ Run linter
        uses: ludeeus/action-shellcheck@94e0aab03ca135d11a35e5bfc14e6746dc56e7e9 # 1.1.0
